# Netlify build configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Publish only the site files, so repo/dev files (README, AGENTS.md, config)
  # are not exposed publicly. Static site — no framework build.
  command = "rm -rf dist && mkdir dist && cp index.html 404.html dist/ && cp -r assets games dist/"
  publish = "dist"

[build.environment]
  # Node 16 is EOL; pin a supported LTS for the build + functions runtime
  NODE_VERSION = "20"
  # fetch Git LFS objects (the games/ builds are stored in LFS)
  GIT_LFS_ENABLED = "true"

# Cache the game builds aggressively — they never change.
[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Site assets change on edits — cache for a week.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
